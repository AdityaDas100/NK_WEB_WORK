spring:
  application:
    name: pharma-inquiry-service

  # ---------------------------------------------------------------------------
  # Datasource / connection pool (HikariCP)
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pharma}
    username: ${DB_USER:pharma}
    password: ${DB_PASSWORD:pharma}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: pharma-hikari
      # Keep the pool deliberately modest: this is an I/O bound intake API and
      # Postgres is most efficient when not oversubscribed (connections <= cores * 2..4).
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 120000
      # Log a warning when a connection is held longer than 20s (leak detection).
      leak-detection-threshold: 20000
      auto-commit: false
      data-source-properties:
        reWriteBatchedInserts: true
        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10
        ApplicationName: pharma-inquiry-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        # Never start the app against a schema that does not match the entities.
        boot:
          allow_jdbc_metadata_access: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: never
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 1MB
    max-connections: 8192
    accept-count: 200
    connection-timeout: 5s
    threads:
      max: 200
      min-spare: 20

# ---------------------------------------------------------------------------
# Actuator (operational endpoints)
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.nkweb.pharma: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    # %X{requestId} is populated by RequestTracingFilter; never log PII (see PiiMasker).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/pharma-inquiry-service.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 2GB
      clean-history-on-start: false

# ---------------------------------------------------------------------------
# Application specific configuration
# ---------------------------------------------------------------------------
app:
  security:
    # Salt/secret used to pseudonymise PII (e-mail, IP) before it reaches the logs.
    # MUST be overridden in every deployed environment.
    hash-secret: ${APP_HASH_SECRET:change-me-in-production-please-32-chars-min}
    # Only honour X-Forwarded-* headers when the app really sits behind a trusted proxy/LB.
    trust-proxy-headers: ${APP_TRUST_PROXY_HEADERS:false}
    require-https: ${APP_REQUIRE_HTTPS:false}
    hsts-max-age-seconds: 31536000

  cors:
    # Strict allow-list. Wildcards are intentionally not supported.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  rate-limit:
    enabled: true
    # Token bucket per client (per forwarded IP), applied to the inquiry endpoint.
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    burst-capacity: ${RATE_LIMIT_BURST:5}
    # Safety net across all clients.
    global-requests-per-minute: ${RATE_LIMIT_GLOBAL_PER_MINUTE:600}
    max-tracked-clients: 100000

  request-limits:
    max-body-bytes: 16384
    max-message-length: 2000

  export:
    enabled: ${EXPORT_ENABLED:true}
    # excel | google-sheets | excel,google-sheets
    sinks: ${EXPORT_SINKS:excel}
    directory: ${EXPORT_DIRECTORY:./data/exports}
    file-name: ${EXPORT_FILE_NAME:inquiries.xlsx}
    sheet-name: Inquiries
    batch-size: 250
    max-attempts: 6
    # Retry sweeper: recovers rows that could not be exported (crash, locked file, sink outage).
    sweep-interval: 15s
    initial-delay: 20s
    # Google Sheets is reachable through an Apps Script web app (see docs/EXPORT.md).
    google-sheets:
      webhook-url: ${GOOGLE_SHEETS_WEBHOOK_URL:}
      bearer-token: ${GOOGLE_SHEETS_TOKEN:}
      timeout: 10s

  async:
    export-core-pool-size: 2
    export-max-pool-size: 4
    export-queue-capacity: 500
