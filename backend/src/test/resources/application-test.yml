spring:
  datasource:
    url: jdbc:h2:mem:pharma;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      # The migrations, not Hibernate, own the schema. Validating keeps entity and DDL in sync.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Export is exercised by dedicated unit tests (real filesystem) and against PostgreSQL in the
  # integration environment; the application context test must not touch the DB or the disk.
  export:
    enabled: false
  rate-limit:
    enabled: true
    requests-per-minute: 1000
    burst-capacity: 1000
    global-requests-per-minute: 1000
  security:
    hash-secret: test-only-secret-please-do-not-use-in-production

logging:
  level:
    root: WARN
    com.nkweb.pharma: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
